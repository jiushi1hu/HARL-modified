#这个yaml文件，作用是：
#          告诉程序：有哪些水库、数据在哪里、模拟哪几年、动作怎么离散、P2 P3 P4怎么定义、长期约束是什么、lambda怎么更新
state_type: "EP" #这里规定HARL使用的中心化状态类型
#在这个项目中，意味着：
#                 Actor：每个水库只看自己的决策观测
#                 Critic：看整个五库系统的集中状态
#
reservoir_order: #这里定义五库的物理串联顺序
  - WDD
  - BHT
  - XLD
  - XJB
  - THR

data: #这里定义环境所需要的数据文件
  root: "data/cascade_reservoir" #表示所有水库数据的总目录，后面的文件路径一般都是相对于整个目录的

  reservoir_physics: "static/reservoir_physics.csv" #这个文件保存每座水库的基本物理参数
  level_storage_anchors: "static/level_storage_anchors.csv" #这是水位-库容关系

  daily_inflow: "timeseries/daily_inflow.csv" #这个文件提供每天的水文输入

  initial_state: "initialization/initial_state.csv" #这个文件告诉环境，开始时，五库各自是什么状态

  water_level_limits: "constraints/water_level_limits.csv" #这个文件提供水位控制边界


simulation: #这里开始定义模拟时间
  start_date: "2023-01-01"
  end_date: "2025-12-31"
  timestep_seconds: 86400 #时间步长度


hydropower: #定义水电计算相关参数
  efficiency: 0.94 #表示综合效率


action: #定义Actor的动作
  num_actions: 401 #动作个数，遵循 docs/Methods.md


operation_stage: #按照一年中的月份，把水库运行划分为四个阶段
  dry_supply: #枯水/供水阶段
    - "01-01"
    - "05-31"

  flood_control: #汛期
    - "06-01"
    - "09-30"

  storage: #蓄水期
    - "10-01"
    - "11-30"

  high_level: #高水位运行阶段
    - "12-01"
    - "12-31"


level_control: #前面回答的是“今天属于什么阶段？”这里回答的是：“这个阶段应该使用哪一列水位限制？”
  dry_supply: "normal_upper_level_m" #这里不是说在枯水期水库要维持在正常蓄水位，只是说正常蓄水位作为这个阶段的上限
  flood_control: "flood_limit_level_m" #这段时间的主要任务包括防洪，所以不能让水库一直蓄到正常蓄水位附近
  storage: "normal_upper_level_m" #这里只规定了“最多可以到正常水位”，但是没有规定：必须马上达到正常蓄水位
  high_level: "normal_upper_level_m"
#这段的意思是：在不同运行阶段，P2的“当前允许上限”从从water_level_limits.csv的哪一列读取

safety: #这一部分就是第一层layer 1

  # 用户授权的临时实验参数；不是有工程依据的运行规程。详见 docs/S3分级松弛与最终违反量比较_暂行方案.md
  p2:
    max_upper_relaxation_m: {WDD: 0.20, BHT: 0.20, XLD: 0.20, XJB: 0.20, THR: 0.20}
    max_lower_relaxation_m: {WDD: 0.0, BHT: 0.0, XLD: 0.0, XJB: 0.0, THR: 0.0}

  fallback:
    comparison: lexicographic_p2_p3_p4
    reference: normal_bounds
    p2_normalization: p1_level_span
    p3_normalization: normal_change_limits
    p4_normalization: normal_required_release
    tie_break: joint_action_lexicographic

  p3: #开始定义P3，也就是相邻时段变化约束
    release_change_ratio: 0.5 #下泄变化比例
    release_change_floor_m3s: 5000.0 #最低变化额度
    max_relaxation_factor: 2.0 #表示P3在S3中最多可以放宽到正常限制的2倍

    level_change_limit_m: #这部分定义正常情况下每天变化多少
      WDD: 0.30
      BHT: 0.50
      XLD: 0.90
      XJB: 0.20
      THR: 1.40

  p4: #定义最低优先级的运行约束
    normal_release_inflow_ratio: 1.0 #正常下泄入流比，为1的话也就是：当前下泄不能低于当前入流
    min_release_inflow_ratio: 0.75 #P4最大松弛边界，也就是下泄最低运行为入流的75%

  relaxation:
    tolerance: 0.001 #表达的是：寻找“最小必要松弛量”时，搜索到多精细就停止 采用二分法
    max_iterations: 16 


long_term_constraints: #Layer 2
  # budget 是折扣 cost 的允许预算 d_j，只进入 lambda 更新比较
  # （gap = Jhat - d_j，lambda <- max(0, lambda + lambda_lr * gap)）。
  # 五个水库按实测区间逐库校准，取值位于 [L, U) 的下半区：
  #   U = 预算敏感性实验（lambda 恒为 0，22 轮）的折扣 cost 均值，即当前水平；
  #   L = 长期约束实验 149 轮中已真实达到过的最小折扣 cost，即可达下限。
  # 取值仍属实验阈值，不是工程合规依据；校准依据与数值见
  # docs/长期约束预算校准_20260929.md。

  - reservoir_id: WDD
    type: "eco_release" #表示约束类型是生态下泄，检查乌东德下泄是否满足生态要求
    requirement: 1200.0 #目标生态下泄要求是1200
    beta: 1.0 #兼容旧配置，仅允许1；修订版原始违反公式不乘额外beta
    normalizer: 1.0 #这是违反cost的归一化参数，1意味着没有通过这个参数进行额外数量级缩放
    tolerance: 0.0 #意味着没有额外的“允许少一点也算满足”的宽容区间
    budget: 0.0 #WDD 全部轨迹零违反（U=0、L=0），没有正预算依据；gap=0，lambda 保持 0
    active_stages: [dry_supply, flood_control, storage, high_level]

  - reservoir_id: BHT
    type: "eco_release"
    requirement: 1200.0
    beta: 1.0
    normalizer: 1.0
    tolerance: 0.0
    budget: 0.0001 #U=0.000374、L=0；低于当前水平，且多数轮次已经满足
    active_stages: [dry_supply, flood_control, storage, high_level]

  - reservoir_id: XLD
    type: "eco_release"
    requirement: 1200.0
    beta: 1.0
    normalizer: 1.0
    tolerance: 0.0
    budget: 0.0025 #U=0.003957、L=0.001839；区间偏低处，目标为已展示过的水平
    active_stages: [dry_supply, flood_control, storage, high_level]

  - reservoir_id: XJB
    type: "eco_release"
    requirement: 1700.0
    beta: 1.0
    normalizer: 1.0
    tolerance: 0.0
    budget: 0.0045 #U=0.005691、L=0.003181；区间中部
    active_stages: [dry_supply, flood_control, storage, high_level]

  - reservoir_id: THR
    type: "eco_release"
    requirement: 6000.0
    beta: 1.0
    normalizer: 1.0
    tolerance: 0.0
    budget: 0.002 #U=0.005028、L=0.000466；审计显示多数违规日存在可满足动作
    active_stages: [dry_supply, flood_control, storage, high_level]


lagrangian:
  initial_value: 0.0 #lambda的初始值
  learning_rate: 0.05 #lambda学习率
